name: Build and deploy ASP.Net app to an Azure Web App

env:
  AZURE_WEBAPP_NAME: bpcalculator    # set this to the name of your Azure Web App
  AZURE_WEBAPP_PACKAGE_PATH: '.'      # set this to the path to your web app project, defaults to the repository root
  DOTNET_VERSION: '10'                 # set this to the .NET Core version to use

on:
  push:
    branches: [ "master" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
            
      - name: Install dependencies
        run: dotnet restore BPCalculator/

      - name: Build with dotnet
        run: dotnet build --configuration Release

      # run standard unit tests
      - name: Run Unit Tests
        run: dotnet test unittestBP/unittestBP.csproj  --verbosity normal -l:trx

      # run Specflow+ tests
      - name: Run Acceptance Tests 
        run: dotnet test AcceptanceTests/AcceptanceTests.csproj  --verbosity normal -l:trx

      # publish web app ready for deployment
      - name: dotnet publish
        run: dotnet publish -c Release -o ${{env.AZURE_WEBAPP_PACKAGE_PATH}}/myapp

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: .net-app
          path: ${{env.AZURE_WEBAPP_PACKAGE_PATH}}/myapp

  deploy:
    runs-on: ubuntu-latest
    needs: build
    steps:

    - name: Download artifact from build job
      uses: actions/download-artifact@v4
      with:
        name: .net-app

    - name: Deploy to Azure Web App
      id: deploy-to-webapp
      uses: azure/webapps-deploy@v3
      with:
        app-name: 'bpcalculator'
        slot-name: 'Production'
        package: .
        publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE  }}
